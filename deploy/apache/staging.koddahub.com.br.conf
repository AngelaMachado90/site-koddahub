<VirtualHost *:80>
    ServerName staging.koddahub.com.br
    DocumentRoot /home/kodda/staging/site-koddahub

    ErrorLog /var/log/httpd/staging.koddahub.com.br_error.log
    CustomLog /var/log/httpd/staging.koddahub.com.br_access.log combined
    DirectoryIndex index.html

    <Directory /home/kodda/staging/site-koddahub>
        Options -Indexes +SymLinksIfOwnerMatch
        AllowOverride None
        Require all granted
    </Directory>

    RemoveHandler .php
    RemoveHandler .php8.0

    <FilesMatch "^\.">
        Require all denied
    </FilesMatch>
</VirtualHost>
